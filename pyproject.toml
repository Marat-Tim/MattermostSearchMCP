[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mm-search-mcp"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "browsercookie==0.8.2",
    "fastmcp==3.2.4",
    "mattermost-api-reference-client==4.2.0",
    "typer==0.25.1",
]

[project.scripts]
mm-search-mcp = "mm_search_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
